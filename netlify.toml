[build]
  command = "pnpm --filter @workspace/proforma-site run build"
  publish = "artifacts/proforma-site/dist/public"

[build.environment]
  NODE_VERSION = "24"
  BASE_PATH = "/"
  PORT = "3000"

[[redirects]]
  from = "/trending"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/trending/*"
  to = "/blog"
  status = 301
  force = true

# Unknown and client-only routes (e.g. /thank-you) get the empty app shell so
# the client router can render them. index.html is now the pre-rendered
# homepage, so it can't be used as the fallback any more.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
